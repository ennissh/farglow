<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Farglow{% endblock %}</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="icon" href="{{ url_for('static', filename='ds/assets/Logo/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/components/bundle.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/htmx/htmx-2.0.4.min.js') }}"></script>
</head>
<body class="fg-app">
  <header class="fg-header">
    <a class="fg-header__brand" href="/">
      <img class="fg-header__mark fg-only-light" src="{{ url_for('static', filename='ds/assets/Logo/farglow-mark-light.svg') }}" alt="" width="24" height="24">
      <img class="fg-header__mark fg-only-dark" src="{{ url_for('static', filename='ds/assets/Logo/farglow-mark-dark.svg') }}" alt="" width="24" height="24">
      <span class="wordmark">farglow</span>
    </a>
    <span class="fg-meta">{{ s.version if s is defined else '' }}</span>
    <button class="fg-btn fg-btn--ghost fg-btn--sm" type="button" data-theme-toggle>Theme</button>
  </header>
  <main class="fg-main">{% block content %}{% endblock %}</main>
  <footer class="fg-footer fg-meta">Every star counts. A Generative Distractions game · © 2026 Citus Technologies, LLC</footer>
</body>
</html>
