<!-- @dsCard group="Art" height=1220 subtitle="32 civilization sets: emblem, colours, banner, ship livery" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>.k{font:500 11px/14px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:10px 0 4px}.row{display:flex;flex-wrap:wrap;gap:4px}.cell{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;line-height:12px;color:var(--ink-secondary);text-align:center}</style>
</head>
<body style="margin:0">
<div class="fg-app" id="root" style="padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px"></div>
<script>
(function(){var s=document.createElement('script');s.src='../../lib/farglow-art.js';s.onload=function(){var A=window.FarglowArt;var h='';A.SETS.forEach(function(s){h+='<div class="fg-panel" style="gap:4px;padding:8px"><div style="display:flex;gap:6px;align-items:center">'+A.emblem(s,52)+A.banner(s,52)+A.livery(s,52)+'<div style="display:flex;flex-direction:column;gap:4px;margin-left:auto">'+A.emblem(s,24)+A.emblem(s,16)+'</div></div><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:13px">'+s.name+'</b><span style="display:flex;gap:3px"><i style="width:12px;height:12px;border-radius:2px;background:'+s.primary+'"></i><i style="width:12px;height:12px;border-radius:2px;background:'+s.trim+';border:1px solid var(--border)"></i></span></div><span class="fg-meta">'+s.primaryName+' / '+s.trimName+' · '+s.frame+' · '+s.livery+' · '+s.banner+'</span></div>';});document.getElementById('root').innerHTML=h;};document.head.appendChild(s);})();
</script>
</body>
</html>
