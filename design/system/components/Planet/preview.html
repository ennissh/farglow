<!-- @dsCard group="Art" height=640 subtitle="Procedural planets, stars and belts from a seed" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>.k{font:500 11px/14px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:10px 0 4px}.row{display:flex;flex-wrap:wrap;gap:4px}.cell{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;line-height:12px;color:var(--ink-secondary);text-align:center}</style>
</head>
<body style="margin:0">
<div class="fg-app" style="padding:16px">
<div style="display:flex;gap:8px;align-items:flex-end"><div class="fg-field"><label class="fg-label" for="seed">Seed</label><input id="seed" class="fg-input" value="41-07-02/hearth" style="width:220px"></div><span class="fg-meta">Same seed, same world. Change it to roll a new system.</span></div>
<div id="root"></div>
</div>
<script>
(function(){var s=document.createElement('script');s.src='../../lib/farglow-art.js';s.onload=function(){var A=window.FarglowArt;function draw(){var seed=document.getElementById('seed').value,h='<div class="k">Stars by class</div><div class="row">';Object.keys(A.STAR_CLASSES).forEach(function(c){h+='<div class="cell">'+A.star(c,56)+'<span>'+c+'</span></div>';});h+='<div class="cell">'+A.star('K',56,{companion:'M'})+'<span>binary K+M</span></div></div>';A.TYPES.forEach(function(t){h+='<div class="k">'+t.replace('_',' ')+'</div><div class="row" style="gap:8px">';for(var i=1;i<=6;i++)h+=A.planet(seed+'/'+i,t,64);h+='</div>';});h+='<div class="k">asteroid belt</div><div class="row">'+A.belt(seed,64)+A.belt(seed+'2',64)+'</div>';document.getElementById('root').innerHTML=h;}draw();document.getElementById('seed').addEventListener('input',draw);};document.head.appendChild(s);})();
</script>
</body>
</html>
