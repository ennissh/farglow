<!doctype html>
<html>
<head>

<body style="margin:0">
<div class="fg-app" style="padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 420px">

</div>
<div class="fg-meter">
<div class="fg-meter__row"><span>Orbital survey array · complete</span><span class="fg-meter__value">100%</span></div>
<div class="fg-meter__track"><div class="fg-meter__fill fg-meter__fill--positive" style="width: 100%"></div></div>
</div>
</div>
