<!-- @dsCard group="Art" height=560 subtitle="60 game icons · 24px grid · currentColor" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>.k{font:500 11px/14px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:10px 0 4px}.row{display:flex;flex-wrap:wrap;gap:4px}.cell{width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;line-height:12px;color:var(--ink-secondary);text-align:center}</style>
</head>
<body style="margin:0">
<div class="fg-app" id="root" style="padding:16px"></div>
<script>
(function(){var s=document.createElement('script');s.src='../../lib/farglow-art.js';s.onload=function(){var A=window.FarglowArt;var h='';Object.keys(A.ICON_GROUPS).forEach(function(g){h+='<div class="k">'+g+'</div><div class="row">';Object.keys(A.ICON_GROUPS[g]).forEach(function(n){h+='<div class="cell" title="'+n+'">'+A.icon(n,24)+'<span>'+n.replace(/_/g,' ')+'</span></div>';});h+='</div>';});document.getElementById('root').innerHTML=h;};document.head.appendChild(s);})();
</script>
</body>
</html>
