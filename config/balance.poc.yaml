# Farglow — PoC balance (config/balance.poc.yaml)
# Status: PROPOSED v1. Tuned against sim.py for the pacing targets below. Combat numbers are not yet simulated.
# All durations are in ticks (1 tick = 1 hour in production). Every number here is data, never code.

pacing_targets:            # what the numbers are tuned to hit (hourly ticks, a reasonably engaged player)
  first_decision: "tick 1"
  first_tech: "within the first day (≤ 24 ticks)"
  first_new_system: "days 2-4"
  first_colony: "days 4-8"
  lattice_open: "days 10-16"
  concord_open: "days 40-60"
  tree_complete: "days 80-110 (then repeatables and, later, transcendence)"

# ---------------------------------------------------------------------------
# Attributes: 6, each −3..+3, must sum to 0. Linear, symmetric, legible.
# ---------------------------------------------------------------------------
attributes:
  list: [curiosity, industry, growth, cohesion, martial, openness]
  range: [-3, 3]
  sum_must_equal: 0
  per_point: 0.05          # each point = ±5% on that attribute's system (so ±15% at the extremes)
  effects:
    curiosity: [research_output, survey_range]          # survey: ±0.5 ly per point
    industry:  [mineral_yield, energy_yield, shipyard_throughput]
    growth:    [pop_growth, habitability_tolerance]
    cohesion:  [stability (±4 per point), policy_cooldown (∓8 ticks per point)]
    martial:   [combat_attack, combat_defense, readiness_decay (inverse), reputation_with_peaceful (−2 per point when positive)]
    openness:  [trade_income, reputation_gain, treaty_terms, intel_leak (+5% per point when positive)]

start:                     # PoC civilization starts at the Reach tier with its home system developed
  attributes: { curiosity: 2, industry: 0, growth: -1, cohesion: 1, martial: -2, openness: 0 }
  population: 12
  minerals: 300
  energy: 50
  stability: 60
  fleet_tons: 600          # one small home-guard squadron
  research_head_start_pct: 50   # the first tech starts half done, so the first payoff lands in day one
  allocation: { expansion: 25, research: 30, social: 10, economic: 20, military: 15 }   # percent of action credits

# ---------------------------------------------------------------------------
# Population → action credits (the economy's root)
# ---------------------------------------------------------------------------
population:
  capacity: { verdant: 10, ocean: 8, super_earth: 2, rocky: 0, gas_giant: 0, ice: 0, belt: 0 }
  capital_bonus: 6         # homeworld holds 16, so a new civ has room to grow
  growth_per_tick: 0.004   # logistic; an empty world fills in ~5-6 weeks, a near-full capital barely grows
  colony_start: 1.0

action_credits:
  per_pop: 8               # 12 pop × 8 = 96 AC/tick at start
  stability_floor: 0.75    # AC multiplier runs 0.75 (stability 0) → 1.0 (50) → 1.25 (100)
  bank_ticks: 48           # unspent AC banks up to two days of income

stability:
  base: 50
  per_cohesion: 4
  social_ac_factor: 1.2    # diminishing returns: stability gain ∝ sqrt(social AC)
  per_extra_system: 3      # every system beyond the first costs 3 stability (anti-snowball)
  drift_per_tick: 1        # moves at most 1 point per tick toward its target

# ---------------------------------------------------------------------------
# Yields per body per tick (see Codex "Resources by body type")
# ---------------------------------------------------------------------------
yields:
  star_energy: { M: 1, K: 2, G: 3, F: 4, A: 6 }     # scaled to real luminosity order
  minerals: { rocky: 3, super_earth: 3, verdant: 1, ocean: 1, ice: 1, belt: 4, gas_giant: 0 }
  gas_giant_energy: 1
  gas_giant_research: 1
  metallicity_factor: 0.5  # minerals × (1 + 0.5 × [Fe/H]); metal-rich stars have richer rock
  energy_upkeep_per_system: 0.5
  energy_storage: 200
  mineral_storage_per_system: 2000   # a cap forces spending; excess is lost (shown as a warning)
  sole_occupancy_bonus_pct: 20

economy:                   # Economic AC develops bodies: +1 yield per level
  dev_cost_base: 700       # level n costs 700 × n AC
  max_dev: 5

# ---------------------------------------------------------------------------
# Buildings: the main mineral and energy sinks (one building per owned body)
# ---------------------------------------------------------------------------
buildings:
  slots: "one per body you own; a system's slots = its owned bodies"
  repeat_cost_growth: 0.15     # each copy of the same building costs 15% more, so players diversify
  reserve_minerals_for_expansion: 400
  build_ticks: 12              # README: "a 12-tick build time"
  list:
    extraction_complex: { minerals: 500,  ac: 300, upkeep_energy: 0.5, on: [rocky, super_earth, belt, ice], effect: "+2 minerals on its body" }
    fusion_plant:       { minerals: 400,  ac: 200, upkeep_energy: 0,   on: any, effect: "+3 energy" }
    research_station:   { minerals: 800,  ac: 400, upkeep_energy: 1,   on: any, effect: "+2 research" }
    habitat_ring:       { minerals: 1200, ac: 600, upkeep_energy: 1,   on: [verdant, ocean, super_earth], effect: "+4 population capacity on its body" }
    civic_forum:        { minerals: 700,  ac: 350, upkeep_energy: 1,   on: any, effect: "+4 stability, civilization-wide" }
    defense_battery:    { minerals: 400,  ac: 100, upkeep_minerals: 1, on: any, effect: "+200 defense strength in its system" }
    warehouse:          { minerals: 300,  ac: 100, upkeep_energy: 0,   on: any, effect: "+2,000 mineral storage" }
    shipyard:           { minerals: 1000, ac: 500, upkeep_energy: 1,   on: populated, effect: "build ships here; +25% hull output" }
    relay_station:      { minerals: 500,  ac: 200, upkeep_energy: 1,   on: any, requires: relay_network, effect: "+4 ly comms range" }
  energy_shortage_output_penalty_pct: 10   # at zero stored energy, minerals and research drop 10%

# ---------------------------------------------------------------------------
# Research
# ---------------------------------------------------------------------------
research:
  rp_per_ac: 0.5           # 0.5 RP per research AC, then attribute and tech multipliers apply
  # tier base costs live in tech_tree.poc.yaml: Reach 600, Lattice 1,600, Concord 4,000; knowledge tax 4% per tech known

# ---------------------------------------------------------------------------
# Expansion
# ---------------------------------------------------------------------------
expansion:
  outpost_ac: 1200         # claim a system with no habitable world
  outpost_minerals: 400
  colony_ac: 2000          # settle a habitable world
  colony_minerals: 600
  survey_ac: 150           # [proposed 4 Nov 2026] send a survey mission to a system beyond survey range
  survey_minerals: 0
  max_reach_ly: 12         # [proposed] surveys and claims reach at most this far from a system you own
  admin_base: 4.0          # AC per tick lost to admin = 4 × systems^1.3 (beyond the first)
  admin_exponent: 1.3

# ---------------------------------------------------------------------------
# Military and combat (not yet simulated; first-pass values)
# ---------------------------------------------------------------------------
military:
  tons_per_ac: 0.5         # military AC builds hull at 2 AC per ton
  minerals_per_ton: 1.5
  upkeep_pct_per_tick: 0.5 # minerals per tick = 0.5% of tonnage (3,460 t → 17 M/tick)
  age_wear_pct_per_tick: 0.02
  unpaid_upkeep_readiness_loss: 2      # readiness points per tick while upkeep is unpaid
combat:
  model: lanchester_square
  rounds_per_tick: 3
  attrition_per_round: 0.08            # tons lost per round = 0.08 × enemy effective strength
  effective_strength: "tons × attack_mult × readiness/100"
  defense_slot_strength: 200           # each installed defense level adds 200 strength to the defender
  randomness_pct: 10                   # seeded ±10% per round
  readiness_loss_per_round: 5
  retreat_default_odds: 0.5            # governor default: retreat below 1:2 odds

# ---------------------------------------------------------------------------
# Movement, comms, diplomacy, NPCs (from the build bundle; listed so all numbers live in one place)
# ---------------------------------------------------------------------------
movement:
  ftl_ly_per_tick: { reach: 0.5, lattice: 1.0, concord: 2.0 }
  comms_ly_per_tick_start: 2
diplomacy:
  reputation_range: [-100, 100]
  broken_treaty_global: -15
  broken_treaty_victim: -40
  decay_to_zero_per_tick: 0.04
  guild_soft_cap: 12
  guild_bonus_loss_per_member_over_cap_pct: 5
npc:
  thinks_every_ticks: 6
  spawn_distance_ly: [15, 40]
  max_strength_vs_new_pc: 0.8          # for the first 500 ticks
  occupation_ticks: [72, 240]
  raid_max_stockpile_pct: 25
  rally_bonus_ticks: 120
protection:
  new_civ_ticks: 168
spawn:
  min_distance_ly: 30
  per_sqrt_power_ly: 1.5               # distance ≥ 30 + 1.5 × sqrt(power) from every existing civ

# Heuristic player used by sim.py
sim_player:
  research_order: [orbital_survey_array, autonomous_foundries, belt_extraction_rigs, civic_archives, dome_habitats,
                   ocean_colonization, signal_compression, envoy_corps, stellar_collectors, gene_banks, relay_bloom,
                   adaptive_biomes, federated_councils, ice_mining, relay_network, market_exchanges, deep_archive]
